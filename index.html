<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trio na Grelha</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- .lateral junta tudo que não é a mesa. Em pé ela "some" (display: contents);
       com o celular deitado vira a coluna da esquerda. -->
  <div class="lateral" id="lateral">
  <header id="topo">
    <h1>🔥 Trio na Grelha <button id="som" class="som" aria-label="Desligar som">🔊</button></h1>
    <!-- Igual aos outros jogos da Jogoteca: o nível fica aqui, no painel -->
    <div class="painel">
      <label>Nível
        <select id="nivel" aria-label="Nível">
          <option value="facil">Fácil</option>
          <option value="medio">Médio</option>
          <option value="dificil">Difícil</option>
        </select>
      </label>
      <button id="recomecar" class="btn-primario">↻ Recomeçar</button>
    </div>
    <p>
      <strong id="fase">Fase 01</strong> ·
      <span id="relogio" aria-live="off">⏱ 0:00</span> · <span id="contador"></span>
    </p>
  </header>

  <div class="poderes" id="poderes" aria-label="Poderes">
    <button id="p-congelar" title="Para o relógio por 10 segundos">❄️ Congelar <b>1</b></button>
    <button id="p-martelo" title="Toque numa comida: 3 dela somem">🔨 Martelo <b>1</b></button>
    <button id="p-juntar" title="Some com 3 da comida mais à vista">✨ Juntar <b>1</b></button>
  </div>

  <p id="aviso" role="status"></p>
  <div class="botoes" id="botoes">
    <button id="proxima" hidden>Próxima fase ➜</button>
    <button id="desfazer" disabled>↶ Desfazer (3)</button>
  </div>

  </div>

  <main id="mesa" aria-label="Grelhas"></main>

  <script src="regras.js"></script>
  <script src="som.js"></script>
  <script src="jogo.js"></script>
</body>
</html>
